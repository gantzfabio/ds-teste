name: Build and Deploy Design Tokens

on:
  push:
    paths:
      - 'tokens/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS Tokens
        run: npm run build:tokens

      - name: Commit and Push generated tokens
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build/css/variables.css
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(tokens): update generated css tokens [skip ci]" && git push)
